name: Final generator repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[repair2]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Fix generated upload handler
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          bad = "r.readAsDataURL(f)}});d.querySelector('.aesthetic-url').oninput=e=>{const u=e.target.value.trim();if(u)files[id]=u;else delete files[id]};"
          good = "r.readAsDataURL(f)};d.querySelector('.aesthetic-url').oninput=e=>{const u=e.target.value.trim();if(u)files[id]=u;else delete files[id]};});"
          if bad in s: s = s.replace(bad, good, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install relationship interaction fallback
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='<!-- pairing-feeling-click-fix -->'
          if marker not in s:
              patch=r'''<!-- pairing-feeling-click-fix -->
<script>
(function(){
const F=[['Blood & Velvet','страсть, опасность и притяжение'],['Midnight Neon','ночная химия и электрическое напряжение'],['Cemetery Gold','мрачная роскошь и что-то почти святое'],['Electric Blue','холодная искра, которая всё равно бьёт током'],['Rust & Smoke','старые раны, дым и упрямое тепло'],['Victorian Noir','тайны, приличия и чувства, о которых нельзя говорить'],['Acid Green','хаос, дерзость и очень плохие решения'],['Moonlight','тихая близость, которую замечают только они'],['Crimson Devotion','преданность на грани одержимости'],['Silver Distance','чувства есть, но между ними километры'],['Golden Trouble','слишком красиво, чтобы быть хорошей идеей'],['Black Lace','опасная нежность и тщательно спрятанные эмоции'],['Violet Fever','романтика, странность и лёгкая потеря рассудка'],['White Noise','много невысказанного и слишком много мыслей'],['Burnt Sugar','сладость с привкусом катастрофы'],['Cold Fire','ледяная сдержанность и внезапные вспышки'],['Velvet Knife','нежность, которая умеет ранить'],['Neon Bruise','ярко, больно и почему-то хочется ещё'],['Holy Static','почти святое чувство с совершенно неправильным напряжением'],['Wild Honey','тепло, опасность и сладкая безрассудность'],['Grave Flowers','красота, выросшая из старых травм'],['Chrome Romance','глянец, дерзость и романтика будущего'],['Dusk & Gold','закатная меланхолия и драгоценная близость'],['Blackout Kiss','момент, который лучше не вспоминать слишком подробно'],['Storm & Silk','буря снаружи, мягкость только друг для друга'],['Paper Hearts','хрупкость, которую оба делают вид, что не замечают'],['Razor Smile','флирт, сарказм и опасная игра'],['Motel Moon','ночная свобода, бегство и случайная близость'],['Ash & Honey','после пожара всё равно осталось что-то сладкое'],['Blue Velvet','медленная чувственность и кинематографическая тоска']];
function init(){['feel1','feel2'].forEach((id)=>{const b=document.getElementById(id);if(!b)return;if(!b.querySelector('.feeling-chip'))b.innerHTML=F.map(x=>'<button type="button" class="feeling-chip" data-feeling="'+x[0]+'"><strong>'+x[0]+'</strong><small>'+x[1]+'</small></button>').join('');if(b.dataset.clickFix==='1')return;b.dataset.clickFix='1';b.addEventListener('click',function(e){const c=e.target.closest('.feeling-chip');if(!c)return;e.preventDefault();e.stopPropagation();b.querySelectorAll('.feeling-chip').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');b.dataset.selected=c.dataset.feeling;window.__pairingFeelings=window.__pairingFeelings||{};window.__pairingFeelings[id==='feel1'?1:2]=c.dataset.feeling;},true);});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();new MutationObserver(init).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>'''
              s=s.replace('</body>',patch+'\n</body>');p.write_text(s,encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "fix: relationship controls and image URLs [repair2]" && git push origin main)
