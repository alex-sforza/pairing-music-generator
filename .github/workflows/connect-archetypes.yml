name: Connect music archetypes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect:
    if: github.event.head_commit.message != 'Connect expanded music archetypes to generator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair relationship controls and image previews
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='<!-- pairing-ui-repair-v3 -->'
          if marker not in s:
              patch=r'''<!-- pairing-ui-repair-v3 -->
<script>
(function(){
const F=[['Blood & Velvet','страсть, опасность и притяжение'],['Midnight Neon','ночная химия и электрическое напряжение'],['Cemetery Gold','мрачная роскошь и что-то почти святое'],['Electric Blue','холодная искра, которая всё равно бьёт током'],['Rust & Smoke','старые раны, дым и упрямое тепло'],['Victorian Noir','тайны, приличия и чувства, о которых нельзя говорить'],['Acid Green','хаос, дерзость и очень плохие решения'],['Moonlight','тихая близость, которую замечают только они'],['Crimson Devotion','преданность на грани одержимости'],['Silver Distance','чувства есть, но между ними километры'],['Golden Trouble','слишком красиво, чтобы быть хорошей идеей'],['Black Lace','опасная нежность и тщательно спрятанные эмоции'],['Violet Fever','романтика, странность и лёгкая потеря рассудка'],['White Noise','много невысказанного и слишком много мыслей'],['Burnt Sugar','сладость с привкусом катастрофы'],['Cold Fire','ледяная сдержанность и внезапные вспышки'],['Velvet Knife','нежность, которая умеет ранить'],['Neon Bruise','ярко, больно и почему-то хочется ещё'],['Holy Static','почти святое чувство с совершенно неправильным напряжением'],['Wild Honey','тепло, опасность и сладкая безрассудность'],['Grave Flowers','красота, выросшая из старых травм'],['Chrome Romance','глянец, дерзость и романтика будущего'],['Dusk & Gold','закатная меланхолия и драгоценная близость'],['Blackout Kiss','момент, который лучше не вспоминать слишком подробно'],['Storm & Silk','буря снаружи, мягкость только друг для друга'],['Paper Hearts','хрупкость, которую оба делают вид, что не замечают'],['Razor Smile','флирт, сарказм и опасная игра'],['Motel Moon','ночная свобода, бегство и случайная близость'],['Ash & Honey','после пожара всё равно осталось что-то сладкое'],['Blue Velvet','медленная чувственность и кинематографическая тоска']];
function ensure(id){const b=document.getElementById(id);if(!b)return;if(!b.querySelector('.feeling-chip'))b.innerHTML=F.map(x=>'<button type="button" class="feeling-chip" data-feeling="'+x[0]+'"><strong>'+x[0]+'</strong><small>'+x[1]+'</small></button>').join('');if(b.dataset.repair==='1')return;b.dataset.repair='1';b.addEventListener('click',function(e){const c=e.target.closest('.feeling-chip');if(!c)return;e.preventDefault();e.stopPropagation();b.querySelectorAll('.feeling-chip').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');b.dataset.selected=c.dataset.feeling;window.__pairingFeelings=window.__pairingFeelings||{};window.__pairingFeelings[id==='feel1'?1:2]=c.dataset.feeling;},true)}
function imgPreview(i,t){const u=(i.value||'').trim();if(!t)return;if(!u){t.textContent='предпросмотр фото';return}const im=new Image();im.onload=()=>{t.replaceChildren(im)};im.onerror=()=>{t.textContent='не удалось загрузить изображение'};im.src=u}
function bind(){ensure('feel1');ensure('feel2');[['photo1','preview1'],['photo2','preview2']].forEach(x=>{const i=document.getElementById(x[0]),t=document.getElementById(x[1]);if(i&&t&&i.dataset.repairImg!=='1'){i.dataset.repairImg='1';i.addEventListener('input',()=>imgPreview(i,t));if(i.value)imgPreview(i,t)}});document.querySelectorAll('.upload-card').forEach(c=>{const i=c.querySelector('.image-url-field input'),t=c.querySelector('.aesthetic-image'),f=c.querySelector('.file-label input[type=file]');if(i&&t&&i.dataset.repairImg!=='1'){i.dataset.repairImg='1';i.addEventListener('input',()=>imgPreview(i,t))}if(f&&t&&f.dataset.repairFile!=='1'){f.dataset.repairFile='1';f.addEventListener('change',()=>{const z=f.files&&f.files[0];if(!z)return;const r=new FileReader();r.onload=e=>t.innerHTML='<img src="'+e.target.result+'" alt="">';r.readAsDataURL(z)})}})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();new MutationObserver(bind).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>'''
              s=s.replace('</body>',patch+'\n</body>');p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Connect expanded music archetypes to generator' && git push)
