name: Connect music archetypes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  connect:
    if: github.event.head_commit.message != 'Connect expanded music archetypes to generator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch archetype engine
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('music-archetypes.js')
          text = p.read_text(encoding='utf-8')
          marker = '\n/* PAIRING MUSIC ARCHETYPE ENGINE V2 */\n'
          if marker in text:
              raise SystemExit(0)
          patch = r'''

/* PAIRING MUSIC ARCHETYPE ENGINE V2 */
(function(){
  const relationWords = {
    'Романтическое напряжение':['Velvet','Gravity','Hearts','Fever'],
    'Соперничество':['Rivalry','Fire','Crown','Clash'],
    'Нежность под сарказмом':['Honey','Static','Smile','Trouble'],
    'Опасное притяжение':['Gravity','Vice','Sin','Fever'],
    'Союз двух хаосов':['Beautiful','Chaos','Riot','Trouble'],
    'Лучшие друзья с подозрительно сильной химией':['Midnight','Friends','Electric','Secret'],
    'Двое против всего мира':['Outlaws','Together','Wild','Against'],
    'Непроизнесённые чувства':['Silence','Echo','Almost','Secret']
  };
  function scoreArchetype(styles, archetype){
    const selected = styles.map(s => String(s).toLowerCase()); let score = 0;
    archetype.genres.forEach(g=>{const x=g.toLowerCase();if(selected.includes(x))score+=10;else if(selected.some(s=>s.includes(x)||x.includes(s)))score+=4;});
    const families=[
      [['glam','theatrical','visual','cabaret'],['Glam Rock','Glam Metal','Glam Punk','Theatrical Rock','Visual Kei','Dark Cabaret','Cabaret Rock']],
      [['gothic','dark','witch','ritual'],['Gothic Rock','Gothic Metal','Darkwave','Dark Pop','Witch House','Ritual Ambient','Industrial Gothic']],
      [['metal','core'],['Heavy Metal','Gothic Metal','Symphonic Metal','Power Metal','Progressive Metal','Metalcore','Deathcore','Black Metal','Death Metal']],
      [['punk','riot'],['Punk Rock','Pop Punk','Hardcore Punk','Gothic Punk','Glam Punk']],
      [['dream','ethereal','ambient'],['Dream Pop','Shoegaze','Ethereal','Ambient','Drone','Minimalist']],
      [['electronic','synth','techno'],['Synthpop','Synthwave','Dark Synthwave','Techno','Industrial Techno','Electropop','Witch House']],
      [['folk','celtic','medieval'],['Folk','Dark Folk','Neofolk','Celtic Folk','Medieval','Folk Metal']],
      [['jazz','blues','soul'],['Jazz','Dark Jazz','Blues Rock','Soul','Funk','Jazz Rock']]
    ];
    families.forEach(([tokens,members])=>{if(styles.some(s=>tokens.some(t=>s.toLowerCase().includes(t))))score+=archetype.genres.filter(g=>members.includes(g)).length*2;});
    return score;
  }
  window.findMusicArchetype=function(styles){if(!styles||!styles.length)return MUSIC_ARCHETYPES[0];let best=MUSIC_ARCHETYPES[0],bestScore=-1;MUSIC_ARCHETYPES.forEach(a=>{const score=scoreArchetype(styles,a);if(score>bestScore){best=a;bestScore=score;}});return best;};
  window.getArchetypeProfile=function(styles,role,relation){const a=window.findMusicArchetype(styles);const roleBits={'вокалист / фронтмен':'считает сцену личной территорией','гитарист':'подозрительно часто решает проблемы соло','басист':'молчит ровно до тех пор, пока не включается бас','барабанщик':'решает эмоциональные вопросы ударными','клавишник':'контролирует атмосферу из тени','продюсер':'заранее знает, где именно всё станет великолепно','mastermind группы':'уже придумал три концептуальных альбома вперёд'};const rb=roleBits[role]||'вносит в эту музыкальную катастрофу собственный порядок';const relationBit=relation?` На фоне их отношений это особенно опасно: ${relation.toLowerCase()}.`:'';return{archetype:a,text:`${a.portrait} ${rb}.${relationBit}`,sound:a.sound};};
  window.buildMusicBandName=function(styles,phrases){const a=window.findMusicArchetype(styles),words=[];(phrases||[]).forEach(p=>(relationWords[p]||[]).forEach(w=>words.push(w)));const unique=[...new Set([...(a.bandWords||[]),...words])];if(unique.length<2)return a.name;return `${unique[0]} ${unique.find(x=>x!==unique[0])||unique[1]}`;};
  MUSIC_ARCHETYPES.forEach(a=>{a.keys=a.genres;a.fun=a.portrait;});
})();
'''
          p.write_text(text + patch, encoding='utf-8')
          PY
      - name: Patch generator connection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="music-archetypes.js"></script>'
          if tag not in text:
              text = text.replace('<script>\nconst genres=', tag + '\n<script>\nconst genres=', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html music-archetypes.js
          git diff --cached --quiet || git commit -m 'Connect expanded music archetypes to generator'
          git push
