name: Repair generator UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[generator-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch index.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Make relationship feelings self-contained and clickable even if an older
          # script version forgot to declare the feelings data.
          marker = "function makeFeelings(id){"
          feelings = """const feelings=window.PAIRING_FEELINGS||[
          ['Blood & Velvet','опасное притяжение, роскошь и скрытая одержимость','опасное притяжение'],
          ['Midnight Neon','тайные встречи, ночные разговоры и электричество','ночь и электричество'],
          ['Cemetery Gold','мрачная красота, преданность и что-то почти вечное','красивая обречённость'],
          ['Electric Blue','холодная искра, дистанция и внезапные вспышки','холодная искра'],
          ['Rust & Smoke','старые раны, честность и тепло сквозь дым','шрамы и тепло'],
          ['Victorian Noir','вежливость, тайны и чувства, которые никто не признаёт','непроизнесённые чувства'],
          ['Acid Green','хаос, дерзость и химия, которую лучше не проверять','токсичная химия'],
          ['Moonlight','тихая близость, доверие и немного магии','тихая близость'],
          ['Crimson Devotion','одержимая верность и слишком сильные чувства','клятва, от которой не уйти'],
          ['Silver Distance','расстояние, сдержанность и взгляды вместо слов','слишком далеко, слишком близко'],
          ['Golden Trouble','флирт, азарт и неизбежные неприятности','красивая неприятность'],
          ['Black Lace','соблазн, секреты и эстетика плохих решений','секреты под чёрным кружевом'],
          ['Violet Fever','мечтательность, странность и эмоциональная лихорадка','лихорадка между нами'],
          ['White Noise','неопределённость, недосказанность и шум в голове','слишком много несказанного'],
          ['Burnt Sugar','сладость, которая обжигает','сладко до боли'],
          ['Cold Fire','противоречие, где никто не хочет уступать','огонь без тепла'],
          ['Velvet Knife','нежность с очень острым краем','нежность, которая режет'],
          ['Neon Bruise','яркие чувства после очередной эмоциональной аварии','красивый синяк'],
          ['Holy Static','почти религиозное восхищение, перемешанное с хаосом','святое безумие'],
          ['Wild Honey','тёплое притяжение, которое быстро становится опасным','сладкая дикость'],
          ['Grave Flowers','красота, выросшая из старых трагедий','цветы на руинах'],
          ['Chrome Romance','холодный блеск, стиль и неожиданная романтика','романтика из металла'],
          ['Dusk & Gold','мягкая тоска и редкие вспышки счастья','золото на закате'],
          ['Blackout Kiss','импульс, после которого никто ничего не помнит','поцелуй после полуночи'],
          ['Storm & Silk','буря снаружи и неожиданная нежность внутри','буря и шёлк'],
          ['Rose Static','романтика, которая всё время даёт помехи','любовь с помехами'],
          ['Ash & Honey','горечь прошлого и неожиданная сладость настоящего','мёд после пепла'],
          ['Dangerous Gold','роскошь, азарт и ощущение, что всё вот-вот сорвётся','золотая авантюра']
          ];
          """
          if marker in s and 'const feelings=window.PAIRING_FEELINGS||' not in s:
              s = s.replace(marker, feelings + marker, 1)

          # Replace the upload card template with a URL field plus the local-file option.
          old = '''d.innerHTML=`<h3>${title}</h3><p>${desc}</p><label class="file-label">+ ДОБАВИТЬ КАРТИНКУ<input type="file" accept="image/*"></label><div class="file-name" id="file-${id}">файл не выбран</div>`;'''
          new = '''d.innerHTML=`<h3>${title}</h3><p>${desc}</p><div class="field image-url-field"><label>Ссылка на изображение</label><input class="aesthetic-url" type="url" placeholder="https://..."></div><label class="file-label">+ ДОБАВИТЬ КАРТИНКУ<input type="file" accept="image/*"></label><div class="file-name" id="file-${id}">файл не выбран</div>`;'''
          if old in s:
              s = s.replace(old, new, 1)

          # The added URL input must not steal the file-input onchange handler.
          old2 = "d.querySelector('input').onchange=e=>{const f=e.target.files[0];if(!f)return;"
          new2 = "d.querySelector('.file-label input').onchange=e=>{const f=e.target.files[0];if(!f)return;"
          s = s.replace(old2, new2, 1)

          # Save a pasted URL into the same files object used by the result renderer.
          needle = "r.readAsDataURL(f)}});"
          replacement = "r.readAsDataURL(f)}});d.querySelector('.aesthetic-url').oninput=e=>{const u=e.target.value.trim();if(u)files[id]=u;else delete files[id]};"
          if needle in s and "aesthetic-url').oninput" not in s:
              s = s.replace(needle, replacement, 1)

          # Small visual treatment for the new URL row.
          css_marker = '.file-label{display:flex;'
          css = '.image-url-field{margin:8px 0}.image-url-field label{font-size:8px}.image-url-field input{font-size:11px;padding:9px}.file-label{display:flex;'
          if css_marker in s and '.image-url-field{' not in s:
              s = s.replace(css_marker, css, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "fix: relationship selectors and image URLs [generator-patch]" && git push origin main)
